# Nombre de la aplicación
spring.application.name=copycom

# Configuración JWT
copycom.app.jwtSecret=MiClaveSecretaSuperSegura2025ParaCOPYCOM123456789!
copycom.app.jwtExpirationMs=86400000

# Configuración MySQL con Laragon
spring.datasource.url=jdbc:mysql://localhost:3306/copycom_dba2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== LOGS COMPLETOS (OPCIONAL - Solo para debug) =====
# Logs de Spring Security (muestra proceso de autenticación)
logging.level.org.springframework.security=DEBUG

# Logs de tu aplicación
logging.level.org.example.copycom=DEBUG

# Logs de peticiones HTTP
logging.level.org.springframework.web=DEBUG

# Logs de SQL (muestra queries a la BD)
logging.level.org.hibernate.SQL=DEBUG

# Logs de valores de parámetros SQL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logs de Hibernate en general
logging.level.org.hibernate.type=TRACE